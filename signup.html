<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNVERO — Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">Cash on Delivery Available</div>

<header class="auth-header">
  <a href="index.html" class="auth-logo">
    <span>Ƶ</span> ZUNVERO
  </a>
</header>

<main class="auth-page">

  <div class="auth-box">

    <p class="auth-small">JOIN ZUNVERO</p>
    <h1>Create Account</h1>
    <p class="auth-subtitle">Create your ZUNVERO customer account</p>

    <label>Full Name</label>
    <input type="text" id="signupName" placeholder="Enter your full name">

    <label>Email</label>
    <input type="email" id="signupEmail" placeholder="Enter your email">

    <label>Password</label>
    <input type="password" id="signupPassword" placeholder="Create a password">

    <label>Confirm Password</label>
    <input type="password" id="signupConfirm" placeholder="Confirm your password">

    <button class="auth-submit" onclick="signupUser()">
      CREATE ACCOUNT
    </button>

    <p class="auth-switch">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</main>

<script src="script.js"></script>

</body>
</html>
